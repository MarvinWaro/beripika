; Runs every Beripika process in one container. Logs go to the container output (Coolify → Logs).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; SOAIS imports ("imports" queue) and Program Catalog sync ("default" queue).
; Same limits as local development; --max-time recycles the worker hourly.
[program:queue]
command=php /var/www/html/artisan queue:work database --queue=default,imports --tries=1 --timeout=45 --sleep=3 --max-time=3600
user=www-data
priority=30
autorestart=true
startsecs=0
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; routes/console.php: queue heartbeat every minute, import-file cleanup nightly.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
