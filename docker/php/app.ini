; Beripika production overrides (on top of php.ini-production).

expose_php = Off

; SOAIS uploads are up to 32 MB; leave headroom for the multipart envelope.
upload_max_filesize = 40M
post_max_size = 48M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Code never changes inside a running container, so never re-check files.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
