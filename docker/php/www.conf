; PHP-FPM pool overrides (loaded after the image's www.conf / zz-docker.conf).
[www]
; Keep Coolify's environment variables visible to PHP (FPM clears them by default).
clear_env = no

; Sized for a shared VPS that also hosts other CHED systems.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; nginx already logs every request; send PHP errors to the container log.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
